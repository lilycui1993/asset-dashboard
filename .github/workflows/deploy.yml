name: Build Asset Dashboard

on:
  schedule:
    # 每个工作日 09:00 北京时间 = 01:00 UTC（周一至周五）
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # akshare 用于 PE/估值分位；安装失败不影响价格抓取（回退缓存）
          pip install akshare || echo "akshare install failed -> PE will use cache"

      - name: Restore cache (跨运行保存上次成功的抓取结果)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cache
          path: .
          if-no-files-found: warn

      - name: Build dashboard (公开API抓取 -> 生成 index.html)
        run: python build_dashboard.py

      - name: Upload cache for next run
        uses: actions/upload-artifact@v4
        with:
          name: cache
          path: cache.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
